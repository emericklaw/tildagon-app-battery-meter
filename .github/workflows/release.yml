name: Create Release

on:
  push:
    branches:
      - main
    paths:
      - 'tildagon.toml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install toml

      - name: Get version from tildagon.toml
        id: version
        run: |
          VERSION=$(python -c "import toml; print(toml.load('tildagon.toml')['metadata']['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check whether this release already exists
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release ${{ steps.version.outputs.tag }} already exists - skipping."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Get commits since last release
        if: steps.check.outputs.exists == 'false'
        id: changes
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$LAST_TAG" ]; then
            LOG=$(git log "$LAST_TAG"..HEAD --pretty=format:'- %s (%h)')
          else
            LOG=$(git log --pretty=format:'- %s (%h)')
          fi
          {
            echo "last-tag=$LAST_TAG"
            echo "log<<GHOUTPUTEOF"
            echo "$LOG"
            echo "GHOUTPUTEOF"
          } >> "$GITHUB_OUTPUT"

      - name: Write release notes
        if: steps.check.outputs.exists == 'false'
        run: |
          cat > release_notes.md <<'EOF'
          Changes since ${{ steps.changes.outputs.last-tag }}:
          ${{ steps.changes.outputs.log }}
          EOF

      - name: Create Release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --notes-file release_notes.md
